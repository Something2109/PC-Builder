services:
  nestjs-prod:
    build:
      context: ../../
      dockerfile: ./docker/nestjs/Dockerfile
      target: prod
    ports:
      - 5000:3000
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MONGO_HOST=mongo:27017
      - DATABASE_NAME=${DATABASE_NAME:-PC_Builder}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-NestjsApp}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?error}
      - JWT_SECRET=${JWT_SECRET:?error}
      - CSRF_SECRET=${CSRF_SECRET:?error}
      - CRAWLER_SERVICE_URL=http://crawler-prod:5001
    profiles:
      - production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  nestjs-dev:
    build:
      context: ../../
      dockerfile: ./docker/nestjs/Dockerfile
      target: dev
    ports:
      - 5000:3000
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MONGO_HOST=mongo:27017
      - DATABASE_NAME=${DATABASE_NAME:-PC_Builder}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-NestjsApp}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?error}
      - JWT_SECRET=${JWT_SECRET:?error}
      - CSRF_SECRET=${CSRF_SECRET:?error}
      - CRAWLER_SERVICE_URL=http://crawler-dev:5001
    profiles:
      - development
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    develop:
      watch:
        - action: sync
          path: ../../apps/backend
          target: /usr/local/app/apps/backend
        - action: sync
          path: ../../packages/shared
          target: /usr/local/app/packages/shared
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../apps/backend/package.json
        - action: rebuild
          path: ../../package-lock.json
