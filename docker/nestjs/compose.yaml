services:
  nestjs-prod:
    build:
      context: ../../
      dockerfile: ./docker/nestjs/Dockerfile
      target: prod
    ports:
      - 5000:3000
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=${DATABASE_NAME:-PC_Builder}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-NestjsApp}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?error}
    env_file:
      - .env
    profiles:
      - production
  nestjs-dev:
    build:
      context: ../../
      dockerfile: ./docker/nestjs/Dockerfile
      target: dev
    ports:
      - 5000:3000
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=${DATABASE_NAME:-PC_Builder}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-NestjsApp}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?error}
    profiles:
      - development
    develop:
      watch:
        - action: sync
          path: ../../
          target: /usr/local/app
          ignore:
            - app
            - components
            - docker
            - public
            - next-env.d.ts
            - next.config.js
            - postcss.config.js
            - tailwind.config.js
