services:
  nextjs-prod:
    build:
      context: ../../
      dockerfile: ./docker/nextjs/Dockerfile
      target: prod
    ports:
      - 4000:3000
    depends_on:
      nestjs-prod:
        condition: service_healthy
    environment:
      - BACKEND_HOST=http://nestjs-prod:3000
      - JWT_SECRET=${JWT_SECRET:?error}
      - HOSTNAME=0.0.0.0
    profiles:
      - production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  nextjs-dev:
    build:
      context: ../../
      dockerfile: ./docker/nextjs/Dockerfile
      target: dev
    ports:
      - 4000:3000
    environment:
      - BACKEND_HOST=http://nestjs-dev:3000
      - JWT_SECRET=${JWT_SECRET:?error}
      - HOSTNAME=0.0.0.0
    profiles:
      - development
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    develop:
      watch:
        - action: sync
          path: ../../apps/frontend
          target: /usr/local/app/apps/frontend
        - action: sync
          path: ../../packages/shared
          target: /usr/local/app/packages/shared
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../apps/frontend/package.json
        - action: rebuild
          path: ../../package-lock.json
