services:
  mysql:
    image: mysql:9.5 # Pinned to a specific stable version for reproducibility
    ports:
      - "3306:3306"
      - "33060:33060"
    volumes:
      - Mysql:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME:-PC_Builder}
      - MYSQL_USER=${DATABASE_USERNAME:-NestjsApp}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD:?error}
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD:?error}
    healthcheck:
      # Checks if the server is ready to accept connections
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    ports:
      - "27017:27017"
    volumes:
      - Mongo:/data/db
    environment:
      - MONGODB_INITDB_DATABASE=${DATABASE_NAME:-PC_Builder}
      # Added authentication. These variables must be in your .env file.
      - MONGODB_INITDB_ROOT_USERNAME=${DATABASE_USERNAME:-NestjsApp}
      - MONGODB_INITDB_ROOT_PASSWORD=${DATABASE_PASSWORD:?error}
    healthcheck:
      # Checks if the MongoDB server is responsive
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  Mysql:
  Mongo:
